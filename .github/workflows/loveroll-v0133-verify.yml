name: Verify LoveRoll 0.13.3 APK release
on:
  pull_request:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android build tools
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android 0.13.3
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signed update is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Release assets for LoveRoll v0.13.3:"
          gh release view des-a-deux-v0.13.3 --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '.tagName, (.assets[].name)'
          gh release view des-a-deux-v0.13.3 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'LoveRoll-v0.13.3.apk'
          echo 'Signed LoveRoll-v0.13.3.apk publication verified.'
