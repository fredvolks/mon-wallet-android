name: Déployer LoveRoll Web sur GitHub Pages
# Supabase's free domain intentionally refuses to render HTML; deploy static frontend to Pages.
on:
  push:
    branches: [des-a-deux-apk-20261013]
    paths:
      - 'couple-web/**'
      - '.github/workflows/deploy-couple-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: couple-web-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/des-a-deux-apk-20261013'
    runs-on: ubuntu-latest
    environment:
      name: loveroll-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration PWA
        run: |
          set -euo pipefail
          node --check couple-web/app.js
          node --check couple-web/config.js
          node --test couple-web/checks.test.mjs couple-web/couple-dashboard.test.mjs
      - name: Activer Pages et préparer le site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Construire la bannière HD LoveRoll pour Messenger
        run: |
          python3 -m pip install --user 'Pillow>=10,<13'
          python3 couple-web/make-social-preview.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          asset=Path('couple-web/assets/loveroll-invite-og.png')
          with Image.open(asset) as im:
              assert im.size==(1200,630), im.size
              assert im.format=='PNG'
          assert asset.stat().st_size>30000
          print('Open Graph image OK:',asset.stat().st_size,'bytes')
          PY
      - name: Téléverser uniquement la PWA (aucun fichier Android ni secret)
        uses: actions/upload-pages-artifact@v4
        with:
          path: couple-web/
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
