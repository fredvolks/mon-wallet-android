name: LoveRoll real production boot and module parity
on:
  pull_request:
    branches: [des-a-deux-apk-20261013]
    paths:
      - 'couple-web/boot-diagnostic.cjs'
      - '.github/workflows/loveroll-production-boot-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser for real script parsing
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Compare deployed app.js to source and open real site
        run: node couple-web/boot-diagnostic.cjs
