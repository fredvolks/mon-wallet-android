name: LoveRoll emergency unblock stuck Pages deploy
on:
  push:
    branches: [des-a-deux-apk-20261013]
    paths: ['.github/workflows/loveroll-unblock-stuck-pages.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    steps:
      - name: Force stop superseded Pages run already sent normal cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Cancelling superseded LoveRoll Pages run 38770059197 only."
          gh api -X POST "repos/${{ github.repository }}/actions/runs/38770059197/force-cancel"
