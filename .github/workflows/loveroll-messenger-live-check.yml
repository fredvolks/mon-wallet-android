name: Vérifier le vrai lien Messenger LoveRoll
on:
  pull_request:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  messenger-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les données Open Graph et l’image en ligne
        run: |
          set -euo pipefail
          URL='https://fredvolks.github.io/mon-wallet-android/'
          curl -fSL --retry 2 --max-time 25 "${URL}index.html" -o /tmp/loveroll-invite.html
          curl -fSL --retry 2 --max-time 25 "${URL}web-version.json" -o /tmp/loveroll-web-version.json
          curl -fSL --retry 2 --max-time 25 "${URL}assets/loveroll-messenger-og-v43.jpg" -o /tmp/loveroll-og.jpg
          python3 - <<'PY'
          from pathlib import Path
          import json
          from html.parser import HTMLParser
          html=Path('/tmp/loveroll-invite.html').read_text()
          version=json.loads(Path('/tmp/loveroll-web-version.json').read_text())
          image=Path('/tmp/loveroll-og.jpg').read_bytes()
          assert version['build']=='2026-10-14.44',version
          assert 'loveroll-messenger-og-v43.jpg' in html
          assert '<meta property="og:image:type" content="image/jpeg">' in html
          assert len(image)>80000 and image[:2]==b'\\xff\\xd8'
          assert 'loveroll-invite-og.png?v=5' not in html
          print('LoveRoll preview LIVE:', version['build'],len(image),'bytes')
          PY
