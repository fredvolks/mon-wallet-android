name: Stock screen backend validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test supabase/functions/analyze-stock-screen/logic.test.ts
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check supabase/functions/analyze-stock-screen/index.ts
