name: Migrate installed LoveRoll 0.13.12 to dedicated repository
# One-time bridge: the installed 0.13.12 only discovers Android updates in
# mon-wallet-android. Sign one v0.13.13 using the existing signing key, with
# the SOURCE CODE from fredvolks/loveroll. Future versions use loveroll.
on:
  push:
    branches: [des-a-deux-apk-20261013]
    paths:
      - '.github/workflows/loveroll-migration-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      GH_REPO: fredvolks/mon-wallet-android
      TAG: des-a-deux-v0.13.13
      KEYSTORE_B64: ${{ secrets.KEYSTORE || secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
      SIGN_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      LOVEROLL_FIREBASE_APP_ID: ${{ vars.LOVEROLL_FIREBASE_APP_ID }}
      LOVEROLL_FIREBASE_API_KEY: ${{ vars.LOVEROLL_FIREBASE_API_KEY }}
      LOVEROLL_FIREBASE_SENDER_ID: ${{ vars.LOVEROLL_FIREBASE_SENDER_ID }}
      LOVEROLL_FIREBASE_PROJECT_ID: ${{ vars.LOVEROLL_FIREBASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - name: Check out pinned LoveRoll source from its dedicated repository
        uses: actions/checkout@v4
        with:
          repository: fredvolks/loveroll
          ref: f552cbce10a1cbad838b8c1eb4e979650bfe0211
          path: source
          persist-credentials: false
      - name: Verify bridge only contains the newly separated LoveRoll app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle').read_text()
          activity=Path('app/src/main/java/ca/desadeux/jeu/ConnectedLoveRollActivity.java').read_text()
          updater=Path('app/src/main/java/ca/desadeux/jeu/UpdateManager.java').read_text()
          assert "applicationId 'ca.desadeux.jeu'" in gradle
          assert "versionCode 130013; versionName '0.13.13'" in gradle
          assert 'private static final String TRUSTED_PATH = "/loveroll/";' in activity
          assert 'private static final String REPO="fredvolks/loveroll";' in updater
          print('Confirmed new LoveRoll native code and update endpoint.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build native signed-update candidate
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Sign with original LoveRoll key, verify upgrade certificate
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$SIGN_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Original LoveRoll signing secrets are unavailable in the old repository."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/loveroll-bridge.jks"
          chmod 600 "$RUNNER_TEMP/loveroll-bridge.jks"
          keytool -list -keystore "$RUNNER_TEMP/loveroll-bridge.jks" -storepass "$STORE_PASSWORD" -alias "$SIGN_ALIAS" >/dev/null
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned-bridge.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/loveroll-bridge.jks" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/LoveRoll-v0.13.13.apk "$RUNNER_TEMP/aligned-bridge.apk"
          cp dist/LoveRoll-v0.13.13.apk dist/Des-a-Deux-v0.13.13.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LoveRoll-v0.13.13.apk
          curl -fL --retry 3 'https://github.com/fredvolks/mon-wallet-android/releases/download/des-a-deux-v0.13.12/LoveRoll-v0.13.12.apk' -o "$RUNNER_TEMP/installed-0.13.12.apk"
          existing_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/installed-0.13.12.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          candidate_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/LoveRoll-v0.13.13.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$existing_cert" && test "$existing_cert" = "$candidate_cert"
          echo 'Existing LoveRoll 0.13.12 signing certificate matched: upgrade without uninstalling is supported.'
          rm -f "$RUNNER_TEMP/loveroll-bridge.jks"
      - name: Publish migration update for already-installed 0.13.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/LoveRoll-v0.13.13.apk dist/Des-a-Deux-v0.13.13.apk --clobber
          else
            gh release create "$TAG" dist/LoveRoll-v0.13.13.apk dist/Des-a-Deux-v0.13.13.apk \
              --target "$GITHUB_SHA" --title "LoveRoll v0.13.13 – nouveau dépôt" \
              --notes "Transition signée depuis LoveRoll 0.13.12 vers https://fredvolks.github.io/loveroll/. Les prochaines mises à jour Android seront lues depuis fredvolks/loveroll. Ne désinstallez pas l'application."
          fi
