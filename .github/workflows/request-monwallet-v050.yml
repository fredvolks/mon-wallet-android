name: Request Mon Wallet v0.2.50 signed release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-monwallet-v050.yml'
permissions:
  actions: write
  contents: read
jobs:
  request-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Watchlist contrast release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-apk.yml/dispatches" \
            -f ref="fix/watchlist-after-contrast-20261022" \
            -f "inputs[release_version]=0.2.50"
