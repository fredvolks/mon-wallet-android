name: Verify Live LoveRoll Web v36
on:
  pull_request:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published LoveRoll assets and Messenger preview
        run: |
          set -euo pipefail
          SITE='https://fredvolks.github.io/mon-wallet-android/'
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 "${SITE}web-version.json" -o /tmp/loveroll-live.json
          echo "Live build:"
          cat /tmp/loveroll-live.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('/tmp/loveroll-live.json').read_text(encoding='utf-8'))
          expected=json.loads(Path('couple-web/web-version.json').read_text(encoding='utf-8'))
          assert live.get('build')==expected.get('build'),f"Live build not yet deployed: {live.get('build')} != {expected.get('build')}"
          PY
          curl --fail --silent --show-error --location --max-time 20 "${SITE}index.html" -o /tmp/loveroll-live.html
          grep -F 'settings-premium.css?' /tmp/loveroll-live.html
          grep -F 'invite-account.css?' /tmp/loveroll-live.html
          grep -F 'property="og:image"' /tmp/loveroll-live.html
          grep -F 'loveroll-invite-og.png' /tmp/loveroll-live.html
          curl --fail --silent --show-error --location --max-time 20 "${SITE}settings-premium.css" -o /tmp/loveroll-settings.css
          grep -F 'main#app.loveroll-settings-page' /tmp/loveroll-settings.css
          curl --fail --silent --show-error --location --max-time 20 "${SITE}invite-account.css" -o /tmp/loveroll-invite.css
          grep -F '.invite-account-screen' /tmp/loveroll-invite.css
          curl --fail --silent --show-error --location --max-time 20 "${SITE}app.js" -o /tmp/loveroll-invite-app.js
          grep -F 'signInWithPassword' /tmp/loveroll-invite-app.js
          grep -F 'autoAcceptPendingInvite' /tmp/loveroll-invite-app.js
          curl --fail --silent --show-error --location --max-time 20 --retry 2 "${SITE}assets/loveroll-invitation-hero-hd.webp" -o /tmp/loveroll-hero-hd.webp
          curl --fail --silent --show-error --location --max-time 20 --retry 2 "${SITE}assets/loveroll-invite-og.png?v=4" -o /tmp/loveroll-invite-og.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          hero=Path('/tmp/loveroll-hero-hd.webp').read_bytes()
          assert len(hero)>=100000 and hero[:4]==b'RIFF','Invalid HD hero image'
          og=Path('/tmp/loveroll-invite-og.png').read_bytes()
          assert len(og)>30000 and og[:8]==b'\x89PNG\r\n\x1a\n','Invalid Messenger OG PNG'
          width,height=struct.unpack('>II',og[16:24])
          assert (width,height)==(1200,630),(width,height)
          print('Live Messenger OG asset verified:',len(og),'bytes,',width,'x',height)
          PY
          curl --fail --silent --show-error --location --max-time 20 "${SITE}discover.mjs" -o /tmp/loveroll-landing.js
          grep -F 'loveroll-invitation-hero-hd.webp' /tmp/loveroll-landing.js
          echo 'Verified LoveRoll current build, invitation page and public Messenger preview image.'
