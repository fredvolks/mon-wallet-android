name: Android validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE }}
      MONWALLET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      MONWALLET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      MONWALLET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      MONWALLET_STORE_FILE: ${{ github.workspace }}/monwallet-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      # ubuntu-latest includes Android SDK Platform 35 and Build Tools 35.0.0.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-build-cache --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MonWallet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build unsigned release for local signing
        env:
          MONWALLET_STORE_FILE: ''
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-build-cache --no-daemon
      - name: Align release and package signing tools
        run: |
          mkdir -p unsigned-dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk unsigned-dist/MonWallet-v0.2.8-aligned-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned-dist/MonWallet-v0.2.8-unsigned.aab
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-dist/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 unsigned-dist/MonWallet-v0.2.8-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MonWallet-v0.2.8-sign-locally
          path: unsigned-dist/*
      - name: Restore signing key
        if: github.event_name == 'push' && env.KEYSTORE_B64 != '' && env.MONWALLET_STORE_PASSWORD != '' && env.MONWALLET_KEY_ALIAS != '' && env.MONWALLET_KEY_PASSWORD != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$MONWALLET_STORE_FILE"
          chmod 600 "$MONWALLET_STORE_FILE"
      - name: Build and verify update APK
        if: github.event_name == 'push' && env.KEYSTORE_B64 != '' && env.MONWALLET_STORE_PASSWORD != '' && env.MONWALLET_KEY_ALIAS != '' && env.MONWALLET_KEY_PASSWORD != ''
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-build-cache --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = "9fa4232613c4cccf611e8114fd121da630bbe0f8f2e6886814fde6225b10750d"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload verified update
        if: github.event_name == 'push' && env.KEYSTORE_B64 != '' && env.MONWALLET_STORE_PASSWORD != '' && env.MONWALLET_KEY_ALIAS != '' && env.MONWALLET_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: MonWallet-v0.2.8-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
      - if: always()
        run: rm -f "$MONWALLET_STORE_FILE"
