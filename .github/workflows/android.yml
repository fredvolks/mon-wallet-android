name: Build and release Des a Deux APK
on:
  push:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: des-a-deux-v0.2.2
      KEYSTORE_B64: ${{ secrets.KEYSTORE || secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
      SIGN_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Sign and verify APK
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$SIGN_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets missing: use existing Android release key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/des-a-deux.jks"
          chmod 600 "$RUNNER_TEMP/des-a-deux.jks"
          keytool -list -keystore "$RUNNER_TEMP/des-a-deux.jks" -storepass "$STORE_PASSWORD" -alias "$SIGN_ALIAS" >/dev/null
          mkdir -p dist
          APK_IN="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/des-a-deux.jks" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/Des-a-Deux-v0.2.2.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Des-a-Deux-v0.2.2.apk
          sha256sum dist/Des-a-Deux-v0.2.2.apk
          rm -f "$RUNNER_TEMP/des-a-deux.jks"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Des-a-Deux-v0.2.2
          path: dist/Des-a-Deux-v0.2.2.apk
          if-no-files-found: error
      - name: Publish GitHub Release (automatic in-app update source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Des-a-Deux-v0.2.2.apk --clobber
          else
            gh release create "$TAG" dist/Des-a-Deux-v0.2.2.apk \
              --target "$GITHUB_SHA" --title "Dés à Deux v0.2.2" \
              --notes "Dé en 3D réaliste avec face gagnante alignée et résultat clair, défis uniques par personne et soirée, boutons Accepter ou Passer avec nouveau défi automatique."
          fi
