name: LoveRoll unified Android/iPad responsive shell emulator check
on:
  push:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
concurrency:
  group: loveroll-responsive-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK for emulator
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify full-screen shared LoveRoll shell on S25 Ultra density
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            adb shell wm size 1440x3120
            adb shell wm density 560
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ca.desadeux.jeu/.ConnectedLoveRollActivity
            sleep 8
            mkdir -p qa
            for attempt in 1 2 3; do
              if adb exec-out screencap -p > qa/loveroll-shared-s25-android.png; then break; fi
              sleep 3
            done
            test "$(stat -c%s qa/loveroll-shared-s25-android.png)" -gt 15000
            adb shell dumpsys activity activities > qa/activities.txt
            grep 'ConnectedLoveRollActivity' qa/activities.txt
            # WebView renders the same HTML app as Safari; UIAutomator may not
            # see WebView DOM nodes. Exercise those through web Playwright CI.
            adb logcat -d -v brief -s AndroidRuntime:E > qa/runtime_errors.txt || true
            if grep -E 'FATAL EXCEPTION' qa/runtime_errors.txt; then
              cat qa/runtime_errors.txt; exit 1
            fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoveRoll-S25-unified-shell-capture
          path: qa/
          if-no-files-found: warn
