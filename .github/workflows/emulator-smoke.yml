name: GPU dice Android emulator smoke test
on:
  push:
    branches: [des-a-deux-apk-20261013]
  workflow_dispatch:
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK for emulator
        run: gradle :app:assembleDebug --no-daemon
      - name: Launch and interact with OpenGL 3D die
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ca.desadeux.jeu/.MainActivity
            sleep 9
            mkdir -p qa
            adb exec-out screencap -p > qa/initial.png
            adb shell pidof ca.desadeux.jeu
            adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
            adb shell cat /sdcard/window.xml > qa/window.xml || true
            python3 - <<'PY'
            import re,subprocess,xml.etree.ElementTree as E,os,time
            xml=open('qa/window.xml',encoding='utf-8').read()
            root=E.fromstring(xml)
            targets=[n for n in root.iter('node') if 'BRASSER LE DÉ HEBDOMADAIRE' in n.attrib.get('text','')]
            if not targets:
              raise RuntimeError('weekly roll button missing from UI')
            bounds=targets[0].attrib['bounds']
            x1,y1,x2,y2=map(int,re.findall(r'\d+',bounds))
            x,y=(x1+x2)//2,(y1+y2)//2
            subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
            time.sleep(4)
            subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('qa/after_roll.png','wb'),check=True)
            pid=subprocess.check_output(['adb','shell','pidof','ca.desadeux.jeu'],text=True).strip()
            if not pid:raise RuntimeError('app process died after 3D animation')
            PY
            adb logcat -d -v brief -s AndroidRuntime:E > qa/runtime_errors.txt
            if grep -E 'FATAL EXCEPTION|java.lang.IllegalStateException.*3D shader' qa/runtime_errors.txt; then
              cat qa/runtime_errors.txt
              exit 1
            fi
            test "$(stat -c%s qa/initial.png)" -gt 15000
            test "$(stat -c%s qa/after_roll.png)" -gt 15000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-dice-emulator-smoke
          path: qa/
          if-no-files-found: warn
