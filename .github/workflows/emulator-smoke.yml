name: LoveRoll unified Android/iPad responsive shell emulator check
on:
  push:
    branches: [des-a-deux-apk-20261013]
  pull_request:
    branches: [des-a-deux-apk-20261013]
    paths: ['app/**', '.github/workflows/emulator-smoke.yml', '.github/scripts/loveroll-emulator-smoke.sh']
  workflow_dispatch:
concurrency:
  group: loveroll-responsive-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK for emulator
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM access on the hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify full-screen shared LoveRoll shell on S25 Ultra density
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/loveroll-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoveRoll-S25-unified-shell-capture
          path: qa/
          if-no-files-found: warn
