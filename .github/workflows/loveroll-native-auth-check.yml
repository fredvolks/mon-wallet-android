name: LoveRoll Android authentication verification
on:
  pull_request:
    branches: [des-a-deux-apk-20261013]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/loveroll-native-auth-check.yml'
  workflow_dispatch:
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
