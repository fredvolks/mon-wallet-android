<!doctype html><html lang="fr-CA"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./premium-dialogs.css">
<style>body{min-height:100dvh;background:radial-gradient(circle at 50% 18%,#5b1641,#180714 77%)}
.test-screen{padding:8vh 18px;text-align:center}.test-screen h1{font:700 2rem Georgia,serif;color:#fff}
.test-screen button{display:block;width:90%;margin:16px auto;min-height:56px;border-radius:18px;
border:1px solid #eb5fa1;background:linear-gradient(130deg,#ba2e76,#fc5e9f);color:#fff;font-weight:700}
#toast{margin:0}</style></head><body><main class="test-screen"><h1>♥ NOTRE SOIRÉE</h1>
<p>Nos 70 défis</p><button id="gift">♡ Donner 1 défi à ma partenaire</button>
<button id="couple">Dissocier mon partenaire</button>
<button id="result">Voir le résultat</button>
<p id="test-result">aucune action confirmée</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import {premiumConfirm} from './premium-dialogs.mjs';
const out=document.getElementById('test-result');
document.getElementById('gift').onclick=async()=>{
 const result=await premiumConfirm('Offrir un de tes défis restants à Camille ? Son nombre de défis à recevoir augmentera de 1 et le tien diminuera de 1.',{kind:'gift'});
 out.textContent=result?'cadeau confirmé':'cadeau annulé';
};
document.getElementById('couple').onclick=async()=>{
 const result=await premiumConfirm('La dissociation s’appliquera aux deux personnes. Vos comptes, défis et cartes personnalisées seront conservés. Les anciennes données communes resteront privées et inaccessibles.',{kind:'couple'});
 out.textContent=result?'dissociation confirmée':'dissociation annulée';
};
document.getElementById('result').onclick=()=>{
 const el=document.getElementById('toast');
 el.className='lr-premium-toast lr-toast-result visible';
 el.innerHTML='<span class="lr-toast-glyph" aria-hidden="true">🎲</span><span class="lr-toast-message"><span class="lr-toast-kicker">RÉSULTAT OFFICIEL</span><span class="lr-toast-result-line"><strong class="lr-toast-result-number">5</strong><span>tirage de Fred</span></span></span><button class="lr-toast-close" aria-label="Fermer">×</button>';
 el.querySelector('button').onclick=()=>el.classList.remove('visible');
};
</script></body></html>
