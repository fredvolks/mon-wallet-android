plugins { id 'com.android.application' }
// Firebase client identifiers are PUBLIC configuration (not service-account secrets).
def firebaseVar = { String key -> (System.getenv(key) ?: '').replace('\\','\\\\').replace('"','\\"') }
android { namespace 'ca.desadeux.jeu'
 compileSdk 35
 defaultConfig { applicationId 'ca.desadeux.jeu'; minSdk 26; targetSdk 35; versionCode 130004; versionName '0.13.4'  }
 buildFeatures { buildConfig true }
 defaultConfig {
  buildConfigField 'String','FIREBASE_APP_ID','"'+firebaseVar('LOVEROLL_FIREBASE_APP_ID')+'"'
  buildConfigField 'String','FIREBASE_API_KEY','"'+firebaseVar('LOVEROLL_FIREBASE_API_KEY')+'"'
  buildConfigField 'String','FIREBASE_SENDER_ID','"'+firebaseVar('LOVEROLL_FIREBASE_SENDER_ID')+'"'
  buildConfigField 'String','FIREBASE_PROJECT_ID','"'+firebaseVar('LOVEROLL_FIREBASE_PROJECT_ID')+'"'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.15.0';
 implementation 'androidx.credentials:credentials:1.5.0';
 implementation 'androidx.credentials:credentials-play-services-auth:1.5.0';
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'; implementation 'com.google.firebase:firebase-messaging:24.1.2'; testImplementation 'junit:junit:4.13.2' }
